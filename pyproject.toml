[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaspace-membrane"
version = "0.3.4"
description = "A deterministic safety membrane for machine-generated software (MetaSpace.Bio Engine Project)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
authors = [{ name = "Szőke László-Ferenc", email = "admin@metaspace.bio" }]
keywords = ["security", "sandbox", "webassembly", "capability", "ai-safety", "guardrail", "claude-code", "agent-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The Warden agent hook + core/ are stdlib-only (zero third-party deps). wasmtime is needed
# ONLY to run the WebAssembly/WASI proofs — hence the optional [proofs] extra, not a runtime dep.
dependencies = []

[project.optional-dependencies]
# The offline licence layer (paid tiers) verifies Ed25519-signed keys; the free Warden
# membrane never loads it, so the runtime stays zero-dep.
pro = ["cryptography>=41"]
proofs = ["wasmtime>=13", "cryptography>=41"]

[project.scripts]
metaspace = "cli:main"

[project.urls]
Homepage = "https://metaspace.bio"
Repository = "https://github.com/LemonScripter/metaspace-membrane"
Issues = "https://github.com/LemonScripter/metaspace-membrane/issues"
Landing = "https://ai-membrane.metaspace.bio"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "products.app_membrane", "products.ai_membrane", "products.mcp_membrane"]

[tool.setuptools.package-data]
# Ship the non-.py data files the CLI needs at runtime (the demo/install flow reads the
# shipped .bio constitution; the app membrane's WASI guest is a prebuilt .wasm). The agy/
# tooling (adapter, mock, launcher, constitution) is shipped as data of ai_membrane — it is run
# as subprocess scripts, not imported, so it ships whole (incl. .py) rather than as a subpackage.
"products.ai_membrane" = ["*.bio", "agy/*.py", "agy/*.bio", "agy/*.bat", "agy/*.ps1", "agy/*.cmd"]
"products.app_membrane" = ["*.wasm"]
